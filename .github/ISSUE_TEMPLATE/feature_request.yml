name: Feature request
description: Suggest a new data source, path, or capability
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out, or decide?
      description: >
        Describe it from the boat's point of view rather than as an
        implementation. What does a skipper do differently once they know this?
      placeholder: >
        Before a night passage at high latitude I want to know whether the HF
        bands will be usable for a scheduled net.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it
      options:
        - A new NOAA data source / product
        - A new Signal K path from data already fetched
        - A change to notifications or alarm thresholds
        - Something in the webapp or aurora map
        - A new configuration setting
        - Something else
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: NOAA endpoint
      description: >
        If this needs data the plugin does not already fetch, link the SWPC
        endpoint. `docs/noaa-products.md` lists the ones already measured.
      placeholder: https://services.swpc.noaa.gov/products/...
    validations:
      required: false

  - type: textarea
    id: setting
    attributes:
      label: If this is a new setting, why can't it have a default?
      description: >
        The bar is a decision only the boat owner can make — one where a
        sensible default would be wrong for someone, and where they can tell the
        difference. See the *Configuration* section of CLAUDE.md. Leave blank if
        this isn't a setting.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do about it today?
      description: >
        A NOAA dashboard you check on your phone, another plugin, a rule of
        thumb — knowing the workaround usually shapes the design.
    validations:
      required: false
