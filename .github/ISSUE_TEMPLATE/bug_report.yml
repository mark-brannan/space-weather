name: Bug report
description: A parser, a product or the webapp does something wrong, or stopped working
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through a
        [private advisory](https://github.com/mark-brannan/space-weather/security/advisories/new)
        instead — please don't file them here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The Kp forecast stopped updating some time yesterday. The webapp still
        shows a value but the timestamp is 19 hours old.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The steps, if it is reproducible. If it happened once and you cannot
        make it happen again, say so — that is still worth reporting.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Where you saw it, and its version
      description: >
        The Signal K plugin (Admin UI → Appstore → Installed), the standalone
        app, the demo page, or this package directly (`npm ls space-weather`).
      placeholder: 'signalk-noaa-space-weather 0.30.10 on Signal K 2.16.0'
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: What is it running on
      description: >
        This code is written for small, often battery-powered hardware, so
        this changes what a plausible cause is.
      options:
        - Raspberry Pi (3 / 4 / 5)
        - Other ARM single-board computer
        - x86 Linux
        - macOS
        - Windows
        - Docker
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      multiple: true
      options:
        - Published Signal K data (paths, values, units)
        - Notifications and alarms
        - The webapp
        - The map
        - The configuration form
        - Something else / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: >
        The lines around the failure — the server log with
        `signalk-noaa-space-weather` in the debug field for the plugin, the
        browser console for the app or the demo. Redact anything you would
        not want public, including position.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        The settings, if the problem might relate to them. For the plugin, the
        raw JSON from
        `<config-dir>/plugin-config-data/signalk-noaa-space-weather.json` is
        ideal.
      render: json
    validations:
      required: false
