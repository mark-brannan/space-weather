version: 2

updates:
  # Two runtime dependencies (the coastline data and its renderer) and the
  # devDeps (typescript, vitest). Grouped into a single monthly PR to keep the
  # noise proportional to the size of the project.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
