version: 2

updates:
  # The plugin has no runtime dependencies, so this only ever moves devDeps
  # (typescript, vitest, the release tooling). Grouped into a single monthly PR
  # to keep the noise proportional to the size of the project.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
