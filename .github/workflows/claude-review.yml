name: Claude PR Review

# An independent reviewer for every PR: a fresh Claude with no shared
# context with whichever session wrote the code. Its job is to enforce
# the gates in CLAUDE.md and AGENTS.md, not to admire the diff.
#
# A run costs real tokens, so it only happens when the PR's content has
# changed. `synchronize` also fires on every rebase -- and Mergify now keeps
# open pull requests up to date with main, so that is no longer rare. The gate
# below hashes the raw tree diff (paths, modes, blob ids) between the merge
# base and HEAD -- not `git patch-id`, which ignores whitespace inside changed
# lines -- and remembers each fingerprint in the Actions cache; a matching
# fingerprint skips the review. It is recorded only once a comment from the
# bot is actually on the PR, because the action exits green even when it
# posted nothing. An evicted entry costs one extra review, never a missed one.
# Ported from mark-brannan/symphony 66bdddc.
#
# Advisory only: no ruleset requires this check.
#
# Auth: needs the CLAUDE_CODE_OAUTH_TOKEN secret (mint one with
# `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
# Swap to `anthropic_api_key` for metered API billing instead.

# `synchronize` is back (2026-09-03) because the cost it used to carry is now
# gated rather than avoided. Narrowing to open/ready-for-review (2026-08-26)
# was the blunt fix for three full reviews of one two-fix PR (#145); the
# fingerprint gate below is the sharp one, and it has to see pushes to work.
# Mergify now keeps open PRs up to date with main, so pushes that change no
# content are the common case, and those are exactly what the gate skips.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # A board-only pull request merges as soon as `version` is green, so a
    # reviewer started here would post into a closed PR that nobody reopens.
    # `paths-ignore` skips the run only when kanban.md is the whole diff; a
    # board edit riding along with anything else still gets reviewed.
    paths-ignore:
      - kanban.md

# Queue rather than cancel: a cancelled review has already spent its tokens
# and never records its fingerprint, so the replacement run would spend them
# again. The common trigger is a Mergify update, which queues behind the
# running review and then skips on the fingerprint.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Skip drafts, and skip fork PRs -- forks can't read the secret, so a
    # run there only produces a red X that means nothing.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fingerprint the PR's content
        id: fp
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch -q origin "$BASE"
          raw=$(git diff-tree -r --no-commit-id "$(git merge-base "origin/$BASE" HEAD)" HEAD)
          if [ -n "$raw" ]; then id=$(printf '%s\n' "$raw" | sha256sum | cut -d' ' -f1); else id=empty; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Skip if this content was already reviewed
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .claude-reviewed
          key: claude-review-pr${{ github.event.pull_request.number }}-${{ steps.fp.outputs.id }}
          lookup-only: true

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # release-please opens its "chore: release" PR as this repo's own
          # GitHub App, not a human -- claude-code-action refuses non-human
          # actors by default (https://github.com/mark-brannan/signalk-noaa-space-weather/actions/runs/33234479071).
          allowed_bots: signalk-noaa-space-weather-release
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the independent reviewer for this repository. You share
            no context with the author -- everything you assert must come
            from the repo, the diff, or something you ran yourself.

            Check the diff against this repo's hard constraints ONLY:
            tests that reach the network, anything that could publish NaN,
            non-SI units or a `units` key on a dimensionless value, a
            weakened gate (a deleted or loosened test, a skipped fixture),
            version-bump handling per AGENTS.md "Versions", and `main`
            staying in package.json. Run `npm ci`, `npm run build`,
            `npm test` and `npm run format:check` yourself.

            Report VIOLATIONS of those constraints, and nothing else. No
            style opinions, no questions, no requests for justification,
            no suggestions on code that already satisfies the constraints.
            If you are not sure something is a violation, it is not a
            finding -- drop it.

            Post each violation as an inline comment via
            mcp__github_inline_comment__create_inline_comment (with
            `confirmed: true`) anchored to the line it concerns, then one
            top-level summary via `gh pr comment`: a single line per
            violation, or "Checked the constraints above; no violations.
            build/test/format all pass." when clean. Do not push commits
            or edit code; you review, the author fixes.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npm run format:check)"

      - if: steps.seen.outputs.cache-hit != 'true'
        name: Confirm a review comment actually landed
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.fp.outputs.since }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length")
          echo "posted=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "::warning::no review comment posted; fingerprint not recorded"

      - if: steps.seen.outputs.cache-hit != 'true' && steps.posted.outputs.posted == 'true'
        name: Remember that this content was reviewed
        run: echo "${{ steps.fp.outputs.id }}" > .claude-reviewed

      - if: steps.seen.outputs.cache-hit != 'true' && steps.posted.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .claude-reviewed
          key: claude-review-pr${{ github.event.pull_request.number }}-${{ steps.fp.outputs.id }}
