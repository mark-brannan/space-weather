name: Secret scan

# This repo is public. These jobs answer "has a credential reached the
# public internet," on the push itself, not on some later PR review.
#
# Why no paths: filter, though it would cut run count: gitleaks and
# trufflehog both scan FULL history (fetch-depth: 0) on every run, so
# filtering by one push's changed files would skip a whole-history scan
# just because the newest commit only touched a README. A path allowlist
# would also gate the scan on the same "files we thought about" list whose
# gaps are the actual leak path.
#
# No sops/encrypted-secrets job here (unlike dotfiles/symphony): this repo
# manages no encrypted secrets. Add one if that changes.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    # Weekly re-scan of unchanged history. Not redundant: trufflehog ships
    # new detectors continuously, so a commit that was clean last month can
    # be flagged this month by a detector that didn't exist then. Minute
    # picked to not collide with the same job in other repos: dotfiles=23,
    # symphony=17, colregs-engine=41.
    - cron: "5 9 * * 1"

# A session that pushes four times in two minutes only needs the newest
# commit scanned; superseded runs are cancelled. Scheduled runs are exempt
# -- the weekly sweep of unchanged history is the one run that must not be
# cancelled by an unrelated push landing on the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # gitleaks (full history) + trufflehog (verified-live only), shared with
  # dotfiles/symphony/colregs-engine via mark-brannan/.github -- see that
  # repo's secret-scan.yml for what each job does and why. This repo has
  # no .gitleaks.toml, so no gitleaks-config input is passed.
  secret-scan:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
