name: Publish

# Publishes to npm using OIDC trusted publishing: npm verifies this workflow's
# short-lived, workflow-scoped identity, so there is no npm token to store,
# rotate, or leak. Provenance attestations are generated automatically.
#
# Prerequisite, done once on npmjs.com: package settings -> Trusted publishers
# -> GitHub Actions, with repository mark-brannan/signalk-noaa-space-weather
# and workflow file `publish.yml`. Until that exists this workflow will fail
# authentication, which is the correct failure mode.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # release.yml triggers this via `gh workflow run publish.yml --ref
  # <tag>` (workflow_dispatch, not workflow_call) after it tags a merge that
  # needed publishing. workflow_call was tried first and doesn't work here:
  # npm's OIDC trusted-publisher check rejects the token minted for a
  # reusable-workflow-call job -- confirmed the hard way, npm error E404,
  # "you do not have permission to access it" -- even though the exact same
  # steps succeed under a direct push or workflow_dispatch trigger of this
  # same file. workflow_dispatch matches how the trusted publisher on
  # npmjs.com is actually configured (this file, this repo), so that's the
  # path both a human and release.yml use to publish out of band.

permissions:
  contents: write # write, not read: this workflow also creates the GitHub Release below
  id-token: write # required: this is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1, newer than what ships with
      # Node 22.
      - run: npm install -g npm@latest

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN. Authentication is the OIDC identity above.
      - run: npm publish

      # A pushed tag is only a git ref -- it does not create a GitHub
      # Release on its own, which is why the Releases page sat on v0.2.0 for
      # eleven versions before this step existed. CHANGELOG.md already has
      # one section per version, so pull this tag's section out as the
      # release notes rather than keeping a second copy of them.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
