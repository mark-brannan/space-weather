name: CI

# Build and test on the two current Node lines. No platform matrix: the Signal
# K plugin that consumes this package runs its own suite across Linux arm64,
# macOS, Windows and armv7 (the Cerbo GX target), and that is where a platform
# difference in the consumer shows up. What can go wrong here is the parsers
# and the page, and those are the same on every host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  # A second tsc pass over the test tree, which the build deliberately
  # excludes; platform-independent, so once is enough.
  typecheck:
    name: Typecheck (src + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # CLAUDE.md orders `npm run format`; this is what enforces it, so a
      # branch cannot land unformatted and show up as noise in the next
      # person's unrelated diff.
      - run: npm run format:check

  # Screenshot goldens (scripts/goldens.mjs): the dashboard quiet and in a
  # storm, the storm's other views and the empty page, off the mock rig with
  # its clock pinned, dark at 1280 and 360 px plus light at 1280. Fails when a
  # shot differs from screenshots/goldens by more than 0.1% of pixels.
  # goldens-out/ (the actual renders, plus a red-mask diff-*.png per failure)
  # is uploaded either way; on a deliberate change, `npm run goldens:update`
  # and commit. A measurement, not a gate, so it stays out of ci-gate's needs
  # until it has a track record. screenshots/goldens/** is what the shared
  # golden-diff workflow (mark-brannan/.github) will score on a PR once it is
  # called from here, in a follow-on.
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The rig's map routes load the products out of dist/.
      - run: npm run build
      - name: Start the mock rig and compare against the goldens
        run: |
          node scripts/mock-webapp.mjs 8731 --host 127.0.0.1 \
            --now 2026-03-20T12:00:00Z > rig.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8731/ > /dev/null && break
            sleep 1
          done
          node scripts/goldens.mjs check http://127.0.0.1:8731
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goldens-out
          path: goldens-out/
          if-no-files-found: ignore

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  prose-budget:
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main
    with:
      require-config: false

  # A measurement, not a gate, so it stays out of ci-gate's needs. Writes the
  # sticky PR comment, hence pull-requests: write.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  # The single required status check, shared across repositories: the `gate`
  # job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed, so it reports an explicit pass or fail
  # of its own rather than inheriting the skip.
  ci-gate:
    needs: [test, typecheck, nonempty, prose-budget]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
