name: Claude PR Review

# An independent reviewer for every pull request -- advisory, and gated on the
# pull request's content fingerprint so a Mergify update that changes nothing
# costs nothing. The reviewer itself is shared: mark-brannan/.github holds the
# workflow, the gate and the argument for both; this file is only the trigger
# and this repository's brief for it.
#
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (mint one with `claude setup-token`,
# then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`). Until it exists the review
# skips with a warning rather than failing every pull request.
#
# `synchronize` is here (since 2026-09-03) because the cost it used to carry is
# now gated rather than avoided. Narrowing to open/ready-for-review (2026-08-26)
# was the blunt fix for three full reviews of one two-fix PR (#145); the
# fingerprint gate is the sharp one, and it has to see pushes to work.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # A board-only pull request merges as soon as `version` is green, so a
    # reviewer started here would post into a closed PR that nobody reopens.
    # `paths-ignore` skips the run only when kanban.md is the whole diff; a
    # board edit riding along with anything else still gets reviewed.
    paths-ignore:
      - kanban.md

# The called workflow asks for exactly these; a caller may grant no less.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      prompt: |
        You are the independent reviewer for this repository. You share
        no context with the author -- everything you assert must come
        from the repo, the diff, or something you ran yourself.

        Check the diff against this repo's hard constraints ONLY:
        tests that reach the network, anything that could publish NaN,
        non-SI units or a `units` key on a dimensionless value, a
        weakened gate (a deleted or loosened test, a skipped fixture),
        version-bump handling per CLAUDE.md "Never touch version numbers", and `main`
        staying in package.json. Run `npm ci`, `npm run build`,
        `npm test` and `npm run format:check` yourself.

        Report VIOLATIONS of those constraints, and nothing else. No
        style opinions, no questions, no requests for justification,
        no suggestions on code that already satisfies the constraints.
        If you are not sure something is a violation, it is not a
        finding -- drop it.

        Post each violation as an inline comment via
        mcp__github_inline_comment__create_inline_comment (with
        `confirmed: true`) anchored to the line it concerns, then one
        top-level summary via `gh pr comment`: a single line per
        violation, or "Checked the constraints above; no violations.
        build/test/format all pass." when clean. Do not push commits
        or edit code; you review, the author fixes.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npm run format:check)
      # release-please opens its "chore: release" PR as this repo's own GitHub
      # App, not a human, and claude-code-action refuses non-human actors by
      # default (https://github.com/mark-brannan/signalk-noaa-space-weather/actions/runs/33234479071).
      allowed-bots: signalk-noaa-space-weather-release
