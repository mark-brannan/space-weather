# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# The board is not code. A pull request whose whole diff is kanban.md merges
# as soon as the `version` check is green (AGENTS.md, "Open loops"), so a
# review of one arrives after the PR is closed and is read by nobody. Filtering
# the file out means such a PR has nothing to review and is skipped, which also
# keeps the hourly review allowance for diffs that can actually be wrong.
reviews:
  path_filters:
    - '!kanban.md'
